# Pings the Supabase project once a day so the free tier doesn't pause it
# after a week without activity. It runs a small real read query (one row
# from `ultimates`), which counts as database activity.
#
# URL and key are the public values the site already ships in its pages.
# To use other values, set the repository secrets SUPABASE_URL and SUPABASE_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dwsieddjvldzurosjdpp.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_SREC_XokfKppXeP7rTgnMQ_-2ZyEXMp' }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/ultimates?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          cat response.json; echo
          if [ "$status" -ne 200 ]; then
            echo "::error::Supabase answered with HTTP $status"
            exit 1
          fi
