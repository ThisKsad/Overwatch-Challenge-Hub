<title>Ultimate Hunt</title>

<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">

<link rel="manifest" href="../manifest.webmanifest">

<meta name="apple-mobile-web-app-title" content="OW Hub">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }

<style>
/* Layout: leaderboard on top, sticky player tabs, then hero tiles grouped by class with a counter under each tile. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface2: #e2e6ed;
  --line: #cdd3dd;
  --fg: #121826;
  --muted: #566074;
  --accent: #a35f00;
  --accent-fill: #f5a524;
  --tank: #2f6fed;
  --damage: #d9363e;
  --support: #0f7d58;
  --danger: #c0262d;
  --good: #0f7d58;
  --warn: #a35f00;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1118;
    --surface: #141b26;
    --surface2: #1c2533;
    --line: #2a3547;
    --fg: #e7ecf4;
    --muted: #8a97ad;
    --accent: #ffb340;
    --accent-fill: #ffb340;
    --tank: #5b97ff;
    --damage: #f0555c;
    --support: #2fc795;
    --danger: #e5484d;
    --good: #2fc795;
    --warn: #ffb340;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1118;
  --surface: #141b26;
  --surface2: #1c2533;
  --line: #2a3547;
  --fg: #e7ecf4;
  --muted: #8a97ad;
  --accent: #ffb340;
  --accent-fill: #ffb340;
  --tank: #5b97ff;
  --damage: #f0555c;
  --support: #2fc795;
  --danger: #e5484d;
  --good: #2fc795;
  --warn: #ffb340;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 18px 40px;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
.back-link { display: inline-block; margin-bottom: 10px; color: var(--muted); font-size: 13px; text-decoration: none; }
.back-link:hover { color: var(--fg); }
.wrap { max-width: 1120px; margin: 0 auto; min-width: 0; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.brand h1 {
  margin: 0;
  font: 700 clamp(36px, 9vw, 52px)/0.95 var(--f-display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  text-wrap: balance;
}
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-state="live"] .dot { background: var(--good); }
.sync[data-state="saving"] .dot { background: var(--warn); }
.sync[data-state="error"] .dot, .sync[data-state="offline"] .dot { background: var(--danger); }
.sync[data-state="viewonly"] .dot { background: var(--warn); }
.icon-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.icon-btn:hover { background: var(--surface2); }
.icon-btn svg { width: 16px; height: 16px; }
.notice {
  margin: 14px 0 0; padding: 10px 14px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn);
  font-size: 14px;
}

/* Leaderboard */
.board { display: flex; flex-direction: column; gap: 8px; margin-block: 22px 26px; padding: 0; list-style: none; }
.board li { display: flex; order: 0; }
.lb {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
  width: 100%; padding: 12px 14px; text-align: left;
  background: var(--surface); color: inherit; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.lb:hover { border-color: var(--muted); }
.lb[aria-current="true"] { border-color: var(--accent-fill); }
.lb .rank { font: 700 24px/1 var(--f-display); color: var(--muted); grid-row: 1 / 3; font-variant-numeric: tabular-nums; }
.lb .who { display: flex; align-items: baseline; gap: 10px; min-width: 0; font: 600 22px/1.1 var(--f-display); letter-spacing: 0.03em; text-transform: uppercase; }
.lb .lead {
  font: 600 11px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 3px 8px;
}
.lb .tot { font: 700 32px/1 var(--f-display); color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.lb .tot small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.lb .sub { grid-column: 2 / 4; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb .meter { grid-column: 1 / -1; margin-top: 8px; }

.meter { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--accent-fill); transition: width 0.25s ease; }

/* Tabs */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 6px 8px; background: transparent; color: var(--muted);
  border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer;
}
.tab .tname { font: 600 22px/1.1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; overflow-wrap: anywhere; }
.tab .tmeta { font-size: 12px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent-fill); }
.tab:hover { color: var(--fg); }

/* Panel */
.panel { padding-block: 22px 8px; }
.summary { display: flex; flex-wrap: wrap; gap: 14px 36px; align-items: flex-end; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat .num { font: 700 clamp(40px, 11vw, 56px)/0.95 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .num.hot { color: var(--accent); }
.stat .lbl { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.overall { margin-top: 16px; }
.overall .meter { height: 10px; }
.controls { margin-top: 14px; display: flex; }
.chk { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; min-height: 32px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent-fill); }

.class { margin-top: 26px; }
.class-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.class-head h2 { margin: 0; font: 700 28px/1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--c); }
.class-head .cnt { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.class .meter { height: 4px; margin-bottom: 14px; }
.class .meter > i { background: var(--c); }
.empty-note { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 10px; }
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tile {
  position: relative; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--c);
  background: linear-gradient(155deg, color-mix(in srgb, var(--c) 88%, #fff), color-mix(in srgb, var(--c) 58%, #000));
  filter: saturate(0.3); opacity: 0.78;
  transition: filter 0.2s ease, opacity 0.2s ease;
}
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mono { font: 700 clamp(30px, 9vw, 40px)/1 var(--f-display); letter-spacing: 0.03em; color: #fff; opacity: 0.92; }
.nm {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 6px 7px;
  text-align: center; font-size: 13px; font-weight: 600; line-height: 1.15; color: #fff; overflow-wrap: anywhere;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.72));
}
.check {
  position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; color: var(--c); display: grid; place-items: center;
}
.check svg { width: 14px; height: 14px; }
.card:not(.done) .check { display: none; }
.card.done .tile { filter: none; opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }

.ctr {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; height: 40px;
}
.step {
  height: 38px; border: 0; background: transparent; color: var(--fg); border-radius: 7px;
  font: 600 22px/1 var(--f-body); cursor: pointer;
}
.step[data-act="inc"] { color: var(--accent); }
.step:hover:not(:disabled) { background: var(--surface2); }
.step:disabled { opacity: 0.3; cursor: default; }
.n { text-align: center; font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }

.panel-foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; }
.btn {
  font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.outline-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { filter: brightness(1.08); background: var(--danger); }

.page-foot { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
.linkish:hover:not(:disabled) { color: var(--danger); }
.linkish:disabled { opacity: 0.4; cursor: default; text-decoration: none; }

/* Confirm dialog */
.scrim {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: rgba(5, 8, 14, 0.62);
}
.dialog {
  width: 100%; max-width: 420px; padding: 22px; border-radius: 12px;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}
.dialog h2 { margin: 0 0 8px; font: 700 28px/1.05 var(--f-display); letter-spacing: 0.03em; text-transform: uppercase; }
.dialog p { margin: 0 0 20px; color: var(--muted); }
.dlg-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px;
  background: var(--fg); color: var(--bg); font-size: 14px; font-weight: 500;
}

@media (max-width: 420px) {
  .lb .tot small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .meter > i, .tile { transition: none; }
}
.winner { margin: 18px 0 0; padding: 22px 18px; border: 2px solid var(--accent-fill); border-radius: 12px; background: var(--surface); text-align: center; display: grid; gap: 10px; justify-items: center; position: relative; overflow: hidden; }
.winner::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% -20%, color-mix(in srgb, var(--accent-fill) 30%, transparent), transparent 65%); pointer-events: none; }
.winner > * { position: relative; }
.winner .w-tag { font: 600 11px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 5px 10px; }
.winner h2 { margin: 0; font: 700 clamp(40px, 11vw, 68px)/0.95 var(--f-display); letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); text-wrap: balance; }
.winner p { margin: 0; max-width: 56ch; color: var(--muted); }
.winner .w-rows { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.winner .w-rows span { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface2); font-size: 13px; font-variant-numeric: tabular-nums; }
.winner .w-rows span.win { border-color: var(--accent-fill); font-weight: 600; }
.winner .w-actions { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; align-items: center; margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .winner { animation: wpop 0.5s cubic-bezier(.3,1.4,.5,1); } @keyframes wpop { from { transform: scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } } }
.winner .btn { font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: inherit; }
.winner .btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: #1a1203; font-size: 16px; padding: 11px 22px; }
.winner .btn:disabled { opacity: 0.5; cursor: default; }
.winner .linkish { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; font-family: inherit; }
.rankmode { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 18px; }
.rm-label { font-size: 13px; color: var(--muted); margin-right: 4px; }
.rm-btn { border: 1px solid var(--line, rgba(128,128,128,.35)); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.rm-btn[aria-pressed="true"] { background: var(--accent, #f99e1a); color: #111; border-color: transparent; font-weight: 600; }
.rm-note { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.rankmode + .board { margin-top: 10px; }
</style>

<script>try{var t=localStorage.getItem('mystery-hub-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<body>
<div class="wrap">
  <a class="back-link" href="../">&larr; All game modes</a>
  <header class="top">
    <div class="brand">
      <h1>Ultimate Hunt</h1>
      <p id="subtitle">Mystery Heroes: get an ultimate with every hero.</p>
    </div>
    <div class="tools">
      <span class="sync" id="sync" data-state="connecting" role="status"><span class="dot"></span><span id="syncText">Connecting…</span></span>
      <button class="icon-btn" id="themeBtn" type="button"></button>
    </div>
  </header>
  <p class="notice" id="notice" hidden></p>
  <section class="winner" id="winner" hidden aria-live="polite">
    <span class="w-tag" id="winnerTag">Hunt complete</span>
    <h2 id="winnerName"></h2>
    <p id="winnerText"></p>
    <div class="w-rows" id="winnerRows"></div>
    <div class="w-actions">
      <button class="btn primary" type="button" id="saveHunt">Save result &amp; start new hunt</button>
      <button class="linkish" type="button" id="keepHunting">Keep playing</button>
    </div>
  </section>

  <div class="rankmode" role="group" aria-label="Ranking">
    <span class="rm-label">Rank by</span>
    <button type="button" class="rm-btn" id="rmHeroes" data-mode="heroes" aria-pressed="true">Heroes done</button>
    <button type="button" class="rm-btn" id="rmUlts" data-mode="ults" aria-pressed="false">Total ultimates</button>
    <span class="rm-note" id="rmNote"></span>
  </div>
  <ol class="board" id="board" aria-label="Leaderboard"></ol>

  <div class="tabs" id="tabs" role="tablist" aria-label="Players"></div>
  <main id="panels"></main>

  <footer class="page-foot">
    <span id="rosterNote"></span>
    <button class="linkish" id="endHunt" type="button">End hunt now</button>
    <button class="linkish" id="resetAll" type="button">Reset everyone</button>
  </footer>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgText">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="dlg-actions">
      <button class="btn" id="dlgCancel" type="button">Keep them</button>
      <button class="btn danger" id="dlgOk" type="button">Delete all ultimates</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  /* ---------- Theme ---------- */

  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function paintThemeBtn() {
    var btn = $('#themeBtn');
    btn.innerHTML = (isDark() ? SUN : MOON) + '<span>' + (isDark() ? 'Light mode' : 'Dark mode') + '</span>';
  }
  try { var saved = localStorage.getItem('mystery-hub-theme'); if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved); } catch (e) {}
  $('#themeBtn').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('mystery-hub-theme', next); } catch (e) {}
    paintThemeBtn();
  });
  paintThemeBtn();

  /* ---------- Build the page ---------- */
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  function cardHtml(h) {
    var img = HERO_IMAGES[h.id];
    var face = img ? '<img src="' + img + '" alt="">' : '<span class="mono">' + mono(h.name) + '</span>';
    return '<article class="card" data-hero="' + h.id + '" data-cls="' + h.cls + '" style="--c: var(--' + h.cls + ')">' +
      '<div class="tile">' + face + '<span class="check">' + CHECK + '</span><div class="nm">' + h.name + '</div></div>' +
      '<div class="ctr">' +
      '<button class="step" type="button" data-act="dec" aria-label="Remove one ultimate on ' + h.name + '">−</button>' +
      '<output class="n">0</output>' +
      '<button class="step" type="button" data-act="inc" aria-label="Add one ultimate on ' + h.name + '">+</button>' +
      '</div></article>';
  }

  function buildPanel(p) {
    var sec = document.createElement('section');
    sec.className = 'panel';
    sec.id = 'panel-' + p.id;
    sec.setAttribute('role', 'tabpanel');
    sec.setAttribute('aria-labelledby', 'tab-' + p.id);
    sec.dataset.player = p.id;
    sec.hidden = p.id !== activePlayer;
    var classes = CLASS_META.map(function (c) {
      var list = inClass(c[0]);
      return '<section class="class" data-cls="' + c[0] + '" style="--c: var(--' + c[0] + ')">' +
        '<div class="class-head"><h2>' + c[1] + '</h2><span class="cnt"><span data-s="cdone">0</span> / ' + list.length + '</span></div>' +
        '<div class="meter"><i data-s="cbar"></i></div>' +
        '<div class="grid">' + list.map(cardHtml).join('') + '</div>' +
        '<p class="empty-note" data-s="cempty" hidden>All ' + list.length + ' ' + c[1].toLowerCase() + ' heroes are done.</p>' +
        '</section>';
    }).join('');
    sec.innerHTML =
      '<div class="summary">' +
      '<div class="stat"><span class="num hot" data-s="total">0</span><span class="lbl">Ultimates</span></div>' +
      '<div class="stat"><span class="num" data-s="done">0</span><span class="lbl">of ' + N + ' heroes done</span></div>' +
      '<div class="stat"><span class="num" data-s="missing">' + N + '</span><span class="lbl">Still missing</span></div>' +
      '</div>' +
      '<div class="overall"><div class="meter" role="img" aria-label="Heroes done"><i data-s="bar"></i></div></div>' +
      '<div class="controls"><label class="chk" for="only-' + p.id + '"><input type="checkbox" id="only-' + p.id + '" data-only> Show only missing heroes</label></div>' +
      classes +
      '<div class="panel-foot"><button class="btn outline-danger" type="button" data-reset="' + p.id + '">Reset ' + p.name + '</button></div>';
    return sec;
  }

  var tabsEl = $('#tabs'), panelsEl = $('#panels'), boardEl = $('#board');
  var panelEls = {}, boardRows = {};

  PLAYERS.forEach(function (p) {
    var t = document.createElement('button');
    t.type = 'button'; t.className = 'tab'; t.id = 'tab-' + p.id; t.dataset.player = p.id;
    t.setAttribute('role', 'tab'); t.setAttribute('aria-controls', 'panel-' + p.id);
    t.innerHTML = '<span class="tname">' + p.name + '</span><span class="tmeta"><span data-tab-done>0</span> / ' + N + ' heroes</span>';
    tabsEl.appendChild(t);
    var panel = buildPanel(p);
    panelEls[p.id] = panel;
    panelsEl.appendChild(panel);

    var li = document.createElement('li');
    li.innerHTML = '<button class="lb" type="button" data-player="' + p.id + '">' +
      '<span class="rank">1</span>' +
      '<span class="who"><span>' + p.name + '</span><span class="lead" hidden>Leading</span></span>' +
      '<span class="tot"><span data-b="big">0</span><small data-b="biglabel">heroes</small></span>' +
      '<span class="sub"><span data-b="small">0</span> · <span data-b="missing">' + N + '</span> heroes missing</span>' +
      '<span class="meter"><i data-b="bar"></i></span></button>';
    boardEl.appendChild(li);
    boardRows[p.id] = li;
  });

  $('#subtitle').textContent = 'Mystery Heroes: get an ultimate with every one of the ' + N + ' heroes.';
  $('#rosterNote').textContent = N + ' heroes · Season 5 roster';

  /* ---------- Render ---------- */
  function refreshPlayer(pid) {
    var panel = panelEls[pid];
    var total = totalOf(pid), done = doneOf(pid);
    $('[data-s="total"]', panel).textContent = total;
    $('[data-s="done"]', panel).textContent = done;
    $('[data-s="missing"]', panel).textContent = N - done;
    $('[data-s="bar"]', panel).style.width = (done / N * 100) + '%';
    $('#tab-' + pid + ' [data-tab-done]').textContent = done;
    var ok = editable(), only = onlyMissing[pid];

    $$('.class', panel).forEach(function (sec) {
      var cdone = 0, ctotal = 0, visible = 0;
      $$('.card', sec).forEach(function (card) {
        var n = cnt(pid, card.dataset.hero);
        ctotal++;
        if (n > 0) cdone++;
        var out = $('.n', card);
        if (out.textContent !== String(n)) out.textContent = n;
        card.classList.toggle('done', n > 0);
        var hide = only && n > 0;
        card.hidden = hide;
        if (!hide) visible++;
        $('[data-act="dec"]', card).disabled = !ok || n === 0;
        $('[data-act="inc"]', card).disabled = !ok;
      });
      $('[data-s="cdone"]', sec).textContent = cdone;
      $('[data-s="cbar"]', sec).style.width = (cdone / ctotal * 100) + '%';
      $('[data-s="cempty"]', sec).hidden = visible !== 0;
    });
    var rb = $('[data-reset]', panel);
    rb.disabled = !ok || total === 0;
    updateResetAll();
  }

  function updateResetAll() {
    var any = PLAYERS.some(function (p) { return totalOf(p.id) > 0; });
    $('#resetAll').disabled = !editable() || !any;
  }

  function renderBoard() {
    var rows = PLAYERS.map(function (p) {
      return { id: p.id, total: totalOf(p.id), done: doneOf(p.id) };
    });
    var sorted = rows.slice().sort(cmpRank);
    ['heroes', 'ults'].forEach(function (m) { $('[data-mode="' + m + '"]').setAttribute('aria-pressed', m === rankMode ? 'true' : 'false'); });
    $('#rmNote').textContent = rankMode === 'ults' ? 'Most ultimates wins; heroes done breaks ties.' : 'Most heroes done wins; total ultimates break ties.';
    sorted.forEach(function (r, i) {
      var rank = (i > 0 && sorted[i - 1].total === r.total && sorted[i - 1].done === r.done) ? sorted[i - 1].rank : i + 1;
      r.rank = rank;
      var li = boardRows[r.id];
      li.style.order = i;
      $('.rank', li).textContent = rank;
      var byHeroes = rankMode !== 'ults';
      $('[data-b="big"]', li).textContent = byHeroes ? r.done : r.total;
      $('[data-b="biglabel"]', li).textContent = byHeroes ? '/ ' + N + ' heroes' : 'ultimates';
      $('[data-b="small"]', li).textContent = byHeroes ? r.total + ' ultimates' : r.done + ' / ' + N + ' heroes';
      $('[data-b="missing"]', li).textContent = N - r.done;
      $('[data-b="bar"]', li).style.width = (r.done / N * 100) + '%';
      $('.lead', li).hidden = !(rank === 1 && r.total > 0);
      $('.lb', li).setAttribute('aria-current', r.id === activePlayer ? 'true' : 'false');
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.rm-btn'), function (b) {
    b.addEventListener('click', function () {
      rankMode = b.dataset.mode;
      try { localStorage.setItem('ultimate-hunt-rank', rankMode); } catch (e) {}
      renderAll();
    });
  });
  function renderAll() {
    PLAYERS.forEach(function (p) { refreshPlayer(p.id); });
    renderBoard();
    renderWinner();
  }

  /* ---------- Hunt winner ---------- */
  function standings() {
    return PLAYERS.map(function (p) { return { id: p.id, done: doneOf(p.id), total: totalOf(p.id) }; })
      .sort(cmpRank);
  }
  function renderWinner() {
    var w = round.winner, box = $('#winner');
    if (!w) { dismissedWin = null; box.hidden = true; $('#endHunt').disabled = !editable() || !PLAYERS.some(function (p) { return totalOf(p.id) > 0; }); return; }
    $('#endHunt').disabled = true;
    box.hidden = dismissedWin === w;
    if (box.hidden) return;
    var full = round.how === 'complete';
    $('#winnerTag').textContent = full ? 'Hunt complete' : 'Hunt ended';
    $('#winnerName').textContent = w === 'tie' ? 'Draw' : nameOf(w) + ' wins';
    $('#winnerText').textContent = (w === 'tie' ? 'Dead heat when the hunt ended.' :
      (full ? nameOf(w) + ' got an ultimate with all ' + N + ' heroes first.' : nameOf(w) + ' had the most heroes done when the hunt ended.')) +
      ' Save the result to the all-time stats and start a new hunt, or keep playing.';
    $('#winnerRows').innerHTML = standings().map(function (r) {
      return '<span class="' + (r.id === w ? 'win' : '') + '">' + nameOf(r.id) + ': ' + r.done + '/' + N + ' heroes &middot; ' + r.total + ' ultimates</span>';
    }).join('');
  }
  function claimWin(pid, how) {
    round = { winner: pid, how: how }; dismissedWin = null; renderWinner();
    sb.rpc('round_claim', { p_mode: 'hunt', p_winner: pid, p_how: how }).then(function () { loadAll(); }, function () { loadAll(); });
  }
  $('#keepHunting').addEventListener('click', function () { dismissedWin = round.winner; renderWinner(); });
  $('#endHunt').addEventListener('click', function () {
    if (!editable() || round.winner) return;
    var s = standings();
    if (s[0].total === 0) { toast('No ultimates logged yet.'); return; }
    var tie = s[1].done === s[0].done && s[1].total === s[0].total;
    openDialog('End the hunt now?', tie ? 'It is a dead heat right now, so the hunt would end as a draw.' : nameOf(s[0].id) + ' would win with ' + s[0].done + ' heroes and ' + s[0].total + ' ultimates. You can still keep playing afterwards.', function () { claimWin(tie ? 'tie' : s[0].id, 'manual'); });
    $('#dlgOk').textContent = 'End hunt';
    $('#dlgCancel').textContent = 'Keep playing';
  });
  $('#saveHunt').addEventListener('click', function () {
    if (!editable() || !round.winner) return;
    var data = { players: {}, heroes: N };
    PLAYERS.forEach(function (p) { data.players[p.id] = { total: totalOf(p.id), done: doneOf(p.id), heroes: JSON.parse(JSON.stringify(counts[p.id])) }; });
    $('#saveHunt').disabled = true;
    sb.rpc('round_finish', { p_mode: 'hunt', p_data: data }).then(function (res) {
      $('#saveHunt').disabled = false;
      if (res.error) { toast('Could not save the result. Please try again.'); return; }
      if (res.data === true) { round = { winner: null, how: null }; doReset(PLAYERS.map(function (p) { return p.id; })); toast('Result saved. New hunt, everyone at 0!'); }
      else { toast('This result was already saved.'); loadAll(); }
    }, function () { $('#saveHunt').disabled = false; toast('Could not save the result. Please try again.'); });
  });

  /* ---------- Tabs ---------- */
  function selectPlayer(pid, focus) {
    activePlayer = pid;
    PLAYERS.forEach(function (p) {
      var on = p.id === pid;
      var t = $('#tab-' + p.id);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      panelEls[p.id].hidden = !on;
    });
    if (focus) $('#tab-' + pid).focus();
    renderBoard();
    try { localStorage.setItem('ultimate-hunt-tab', pid); } catch (e) {}
  }
  tabsEl.addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (t) selectPlayer(t.dataset.player, false);
  });
  tabsEl.addEventListener('keydown', function (e) {
    var i = PLAYERS.map(function (p) { return p.id; }).indexOf(activePlayer);
    if (e.key === 'ArrowRight') { selectPlayer(PLAYERS[(i + 1) % PLAYERS.length].id, true); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { selectPlayer(PLAYERS[(i + PLAYERS.length - 1) % PLAYERS.length].id, true); e.preventDefault(); }
  });
  boardEl.addEventListener('click', function (e) {
    var b = e.target.closest('.lb');
    if (b) { selectPlayer(b.dataset.player, false); $('#tabs').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  });

  /* ---------- Status ---------- */
  var SYNC_TEXT = {
    connecting: 'Connecting…',
    live: 'Live, shared with everyone',
    setup: 'Setup needed',
    offline: 'Not connected',
    error: 'Could not save'
  };
  function setMode(m) {
    mode = m;
    $('#sync').dataset.state = m;
    $('#syncText').textContent = SYNC_TEXT[m] || '';
    var note = $('#notice');
    if (m === 'setup') {
      note.textContent = 'Add your Supabase project URL and public key at the top of the script in this file, then reload the page.';
      note.hidden = false;
    } else if (m === 'offline') {
      note.textContent = 'The shared database could not be reached. Check your internet connection and reload the page.';
      note.hidden = false;
    } else if (m === 'error') {
      note.textContent = 'The last change could not be saved. Check your connection; the page keeps retrying in the background.';
      note.hidden = false;
    } else {
      note.hidden = true;
    }
    renderAll();
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- Writing ---------- */
  var sb = null, loaded = false;
  var pending = {};            // "player|hero" -> taps still waiting for the database
  var epoch = {};              // bumped on reset so late answers are ignored
  PLAYERS.forEach(function (p) { epoch[p.id] = 0; });
  function key(pid, hid) { return pid + '|' + hid; }

  function failure(msg) {
    setMode('error');
    toast(msg || 'Could not save. Please try again.');
  }

  function step(pid, hid, delta) {
    if (!editable()) return;
    var cur = cnt(pid, hid), next = Math.max(0, cur + delta);
    if (next === cur) return;
    counts[pid][hid] = next;
    var k = key(pid, hid), ep = epoch[pid];
    pending[k] = (pending[k] || 0) + 1;
    refreshPlayer(pid);
    renderBoard();
    if (delta > 0 && doneOf(pid) === N && !round.winner) claimWin(pid, 'complete');
    sb.rpc('bump', { p_player: pid, p_hero: hid, p_delta: delta }).then(function (res) {
      if (ep !== epoch[pid]) return;
      pending[k] = Math.max(0, (pending[k] || 1) - 1);
      if (res.error) { failure(); loadAll(); return; }
      if (!pending[k] && typeof res.data === 'number') {
        if (res.data > 0) counts[pid][hid] = res.data; else delete counts[pid][hid];
        refreshPlayer(pid);
        renderBoard();
      }
      if (mode === 'error') setMode('live');
    }, function () {
      if (ep !== epoch[pid]) return;
      pending[k] = Math.max(0, (pending[k] || 1) - 1);
      failure();
      loadAll();
    });
  }

  function doReset(pids) {
    pids.forEach(function (pid) {
      epoch[pid]++;
      counts[pid] = {};
      Object.keys(pending).forEach(function (k) { if (k.indexOf(pid + '|') === 0) delete pending[k]; });
    });
    renderAll();
    var q = sb.from('ultimates').delete();
    q = pids.length === PLAYERS.length ? q.neq('player', '') : q.in('player', pids);
    q.then(function (res) {
      if (res.error) { failure('Reset did not go through. Please try again.'); loadAll(); return; }
      toast(pids.length > 1 ? 'Everyone reset to 0' : nameOf(pids[0]) + ' reset to 0');
      if (mode === 'error') setMode('live');
    }, function () { failure('Reset did not go through. Please try again.'); loadAll(); });
  }

  /* ---------- Confirm dialog ---------- */
  var lastFocus = null, pendingRun = null;
  function openDialog(title, text, run) {
    lastFocus = document.activeElement;
    $('#dlgTitle').textContent = title;
    $('#dlgText').textContent = text;
    $('#dlgOk').textContent = 'Delete all ultimates';
    $('#dlgCancel').textContent = 'Keep them';
    pendingRun = run;
    $('#scrim').hidden = false;
    $('#dlgCancel').focus();
  }
  function closeDialog() {
    $('#scrim').hidden = true;
    pendingRun = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function askReset(target) {
    var pids = target === 'all' ? PLAYERS.map(function (p) { return p.id; }) : [target];
    var n = pids.reduce(function (s, pid) { return s + totalOf(pid); }, 0);
    if (target === 'all') {
      openDialog('Reset everyone?',
        'This deletes all ' + n + ' ultimates logged by ' + PLAYERS.map(function (p) { return p.name; }).join(', ') +
        ' and sets every hero back to 0. This cannot be undone.',
        function () { doReset(pids); });
    } else {
      openDialog('Reset ' + nameOf(target) + '?',
        'This deletes all ' + n + ' ultimates logged for ' + nameOf(target) +
        ' and sets every hero back to 0. The other players keep their counts. This cannot be undone.',
        function () { doReset(pids); });
    }
  }
  $('#dlgCancel').addEventListener('click', closeDialog);
  $('#dlgOk').addEventListener('click', function () {
    var run = pendingRun;
    closeDialog();
    if (run && editable()) run();
  });
  $('#scrim').addEventListener('click', function (e) { if (e.target === $('#scrim')) closeDialog(); });
  document.addEventListener('keydown', function (e) {
    if ($('#scrim').hidden) return;
    if (e.key === 'Escape') { closeDialog(); return; }
    if (e.key === 'Tab') {
      var a = $('#dlgCancel'), b = $('#dlgOk');
      if (e.shiftKey && document.activeElement === a) { b.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === b) { a.focus(); e.preventDefault(); }
    }
  });
  $('#resetAll').addEventListener('click', function () { askReset('all'); });

  panelsEl.addEventListener('click', function (e) {
    var s = e.target.closest('button[data-act]');
    if (s) {
      var card = s.closest('.card');
      step(s.closest('.panel').dataset.player, card.dataset.hero, s.dataset.act === 'inc' ? 1 : -1);
      return;
    }
    var r = e.target.closest('button[data-reset]');
    if (r) askReset(r.dataset.reset);
  });
  panelsEl.addEventListener('change', function (e) {
    if (e.target.matches('input[data-only]')) {
      var pid = e.target.closest('.panel').dataset.player;
      onlyMissing[pid] = e.target.checked;
      refreshPlayer(pid);
    }
  });

  /* ---------- Shared storage (Supabase) ---------- */
  function applyRows(rows) {
    var fresh = {};
    PLAYERS.forEach(function (p) { fresh[p.id] = {}; });
    rows.forEach(function (r) {
      if (fresh[r.player] && HERO_IDS[r.hero] && typeof r.count === 'number' && r.count > 0) fresh[r.player][r.hero] = r.count;
    });
    PLAYERS.forEach(function (p) {
      var next = {};
      HEROES.forEach(function (h) {
        var v = pending[key(p.id, h.id)] > 0 ? cnt(p.id, h.id) : (fresh[p.id][h.id] || 0);
        if (v > 0) next[h.id] = v;
      });
      counts[p.id] = next;
    });
    renderAll();
  }

  function loadAll() {
    return Promise.all([sb.from('ultimates').select('player,hero,count'), sb.from('rounds').select('winner,how').eq('mode', 'hunt').maybeSingle()]).then(function (rr) {
      var res = rr[0], rrow = rr[1] && !rr[1].error ? rr[1].data : null;
      round = { winner: rrow && rrow.winner ? rrow.winner : null, how: rrow ? rrow.how : null };
      if (res.error) {
        if (!loaded) setMode('offline'); else setMode('error');
        return;
      }
      if (!loaded) {
        loaded = true;
        canWrite = true;
        seen = PLAYERS.length;
        setMode('live');
      } else if (mode === 'error' || mode === 'offline') {
        setMode('live');
      }
      applyRows(res.data || []);
    }, function () {
      if (!loaded) setMode('offline'); else setMode('error');
    });
  }

  function connect() {
    var url = (typeof SUPABASE_URL === 'string' ? SUPABASE_URL : '').trim();
    var anon = (typeof SUPABASE_KEY === 'string' ? SUPABASE_KEY : '').trim();
    if (!url || !anon || url.indexOf('PASTE') === 0 || anon.indexOf('PASTE') === 0) { setMode('setup'); return; }
    if (!window.supabase || typeof window.supabase.createClient !== 'function') { setMode('offline'); return; }
    sb = window.supabase.createClient(url, anon);
    loadAll();
    var t = null;
    function poke() { clearTimeout(t); t = setTimeout(loadAll, 150); }
    sb.channel('ultimates-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ultimates' }, poke)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rounds' }, poke)
      .subscribe();
    setInterval(loadAll, 20000);
  }

  /* ---------- Start ---------- */
  try {
    var tab = localStorage.getItem('ultimate-hunt-tab');
    if (tab && PLAYERS.some(function (p) { return p.id === tab; })) activePlayer = tab;
  } catch (e) {}
  selectPlayer(activePlayer, false);
  renderAll();
  connect();
})();
</script>
</body>
</html>
